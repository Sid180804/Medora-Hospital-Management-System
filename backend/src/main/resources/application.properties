# MEDORA - Smart Hospital Appointment Management System
# Spring Boot Configuration

spring.application.name=medora-hospital
server.port=8080

# In-Memory H2 Database Configuration
# The database runs entirely in memory and safely resets upon restart.
spring.datasource.url=jdbc:h2:mem:medoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson / JSON Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
